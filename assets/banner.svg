<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6F9"/>
      <stop offset="55%" stop-color="#FBE3EC"/>
      <stop offset="100%" stop-color="#F6D0DE"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F4B6C9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F4B6C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font-family: 'Didot', 'Bodoni 72', 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 72px; fill: #5A3E47; letter-spacing: 1px; }
      .sub  { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; fill: #9C6B7D; letter-spacing: 5px; }
      .code { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 16px; fill: #C98AA0; }
      .spark { fill: #E8A3B9; transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
      .float { animation: float 7s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- soft blobs -->
  <g class="float">
    <circle cx="1060" cy="70" r="170" fill="url(#blob1)"/>
    <circle cx="130" cy="280" r="150" fill="url(#blob1)"/>
  </g>
  <circle cx="300" cy="60" r="120" fill="url(#blob2)"/>

  <!-- thin decorative line -->
  <line x1="450" y1="196" x2="750" y2="196" stroke="#E8A3B9" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="600" cy="196" r="4" fill="#E8A3B9"/>

  <!-- text -->
  <text x="600" y="160" text-anchor="middle" class="name">Isabelle Lynch</text>
  <text x="600" y="240" text-anchor="middle" class="sub">SOFTWARE DEVELOPMENT STUDENT · MTU KERRY</text>
  <text x="600" y="282" text-anchor="middle" class="code">&lt;/&gt; java · python · javascript · c# · sql</text>

  <!-- sparkles -->
  <path class="spark" d="M180 90 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
  <path class="spark s2" d="M1010 230 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
  <path class="spark s3" d="M960 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  <path class="spark s3" d="M150 190 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
  <path class="spark s2" d="M1110 160 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
</svg>
