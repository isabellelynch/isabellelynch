<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 110" width="592" height="110">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFF6F9"/><stop offset="55%" stop-color="#FBE3EC"/><stop offset="100%" stop-color="#F6D0DE"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<style>
